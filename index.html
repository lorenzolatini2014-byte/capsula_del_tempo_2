<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsula del Tempo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .descrizione {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            text-align: left;
            line-height: 1.6;
            font-size: 1rem;
            color: #94a3b8;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .descrizione h2 {
            color: #f8fafc;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .form-capsula {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 600;
        }

        input[type="text"],
        input[type="file"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }

        input[type="file"] {
            cursor: pointer;
            color: #94a3b8;
        }

        .btn-invia {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-invia:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.6);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Capsula del Tempo</h1>
        
        <div class="descrizione">
            <h2>Come funziona</h2>
            <p>Inserisci il tuo nome e cognome, carica la foto che vuoi conservare e inviala. Arriverà dritta a me e io la custodirò al sicuro per te!</p>
        </div>

        <form id="formCapsula" class="form-capsula">
            
            <div class="form-group">
                <label for="nome">Nome e Cognome:</label>
                <input type="text" id="nome" name="nome_cognome" required placeholder="Es. Mario Rossi">
            </div>

            <div class="form-group">
                <label for="foto">Seleziona la tua foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>

            <!-- Campo nascosto che conterrà il link diretto della foto -->
            <input type="hidden" id="linkFoto" name="link_foto">

            <button type="submit" class="btn-invia" id="btnInvia">Invia la Capsula</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Capsula del Tempo. Tutti i diritti riservati. Fatto con Python e Vercel.
    </footer>

    <script>
        const form = document.getElementById('formCapsula');
        const fotoInput = document.getElementById('foto');
        const btnInvia = document.getElementById('btnInvia');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const file = fotoInput.files[0];
            const nome = document.getElementById('nome').value;
            if (!file) return;

            btnInvia.textContent = "Caricamento foto in corso...";
            btnInvia.disabled = true;

            try {
                // 1. Carica la foto su ImgBB (servizio gratuito pubblico per immagini)
                const formDataImg = new FormData();
                formDataImg.append("image", file);

                const resImg = await fetch("https://api.imgbb.com/1/upload?key=6d207e024de4a8949811f59781b0a8f8", {
                    method: "POST",
                    body: formDataImg
                });
                const dataImg = await resImg.json();

                if (!dataImg.success) {
                    throw new Error("Errore durante il caricamento dell'immagine.");
                }

                const imageUrl = dataImg.data.url;
                document.getElementById('linkFoto').value = imageUrl;

                btnInvia.textContent = "Invio della capsula...";

                // 2. Invia i dati a Formspree (Nome + Link diretto della foto)
                const resForm = await fetch("https://formspree.io/f/mvkgeezj", {
                    method: "POST",
                    body: new FormData(form),
                    headers: { 'Accept': 'json' }
                });

                if (resForm.ok) {
                    alert("Capsula inviata con successo! La foto è arrivata a destinazione.");
                    form.reset();
                } else {
                    alert("Errore nell'invio del modulo. Riprova.");
                }
            } catch (err) {
                alert("Si è verificato un errore: " + err.message);
            } finally {
                btnInvia.textContent = "Invia la Capsula";
                btnInvia.disabled = false;
            }
        });
    </script>

</body>
</html>
